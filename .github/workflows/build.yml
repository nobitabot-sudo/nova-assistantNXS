name: Build Nova APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Download the offline wake word model (Vosk, Indian English, Apache-2.0)
        shell: bash
        run: |
          curl -fL --retry 3 -o vosk-model.zip https://alphacephei.com/vosk/models/vosk-model-small-en-in-0.4.zip
          unzip -q vosk-model.zip
          mkdir -p app/src/main/assets
          rm -rf app/src/main/assets/vosk-model
          mv vosk-model-small-en-in-0.4 app/src/main/assets/vosk-model
          cat /proc/sys/kernel/random/uuid > app/src/main/assets/vosk-model/uuid
          ls app/src/main/assets/vosk-model

      - name: Build debug APK
        shell: bash
        run: |
          chmod +x ./gradlew
          ./gradlew :app:assembleDebug --stacktrace --no-daemon 2>&1 | tee build.log

      - name: Upload build log (only if the build failed)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log

      - name: Upload APK as an artifact
        uses: actions/upload-artifact@v4
        with:
          name: Nova-apk
          path: app/build/outputs/apk/debug/*.apk

      - name: Publish APK to the "latest" release (easy download on the phone)
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk Nova.apk
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest Nova.apk \
            --title "Nova (latest build)" \
            --notes "Latest debug build of Nova. Download Nova.apk on your phone and install it." \
            --prerelease
